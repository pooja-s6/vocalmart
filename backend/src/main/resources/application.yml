server:
  port: 8080

spring:
  application:
    name: vocalmart
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vocalmart}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:vocalmart-local-dev-jwt-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.vocalmart: INFO
