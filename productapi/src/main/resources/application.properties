spring.application.name=productapi

server.port=${PORT:8081}

spring.datasource.url=jdbc:h2:mem:vocalmart;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,https://*.vercel.app